# Publie app/ sur GitHub Pages à chaque push sur main.
# Variables du dépôt (Settings → Secrets and variables → Actions → Variables) :
#   SUPABASE_URL, SUPABASE_ANON_KEY (publique par nature), OKA_ACTIVATION_OBLIGATOIRE (1 ou 0, facultatif)
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configuration et version du cache hors ligne
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          OKA_ACTIVATION_OBLIGATOIRE: ${{ vars.OKA_ACTIVATION_OBLIGATOIRE }}
        run: |
          node tools/config.mjs
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploiement
        uses: actions/deploy-pages@v4
